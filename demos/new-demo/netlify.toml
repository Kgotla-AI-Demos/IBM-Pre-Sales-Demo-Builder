# Netlify build & deployment config
# Frontend: built from demos/new-demo/frontend/
# Backend:  IBM Cloud Code Engine container (separate deploy — see scripts/deploy-codengine.sh)
#
# Required Netlify environment variables (set in Netlify UI → Site Settings → Environment Variables):
#   VITE_API_BASE_URL   = https://<your-app>.us-south.codeengine.appdomain.cloud/api
#   VITE_DEMO_TITLE     = "Factory AI Predictive Maintenance — Built with IBM watsonx"
#   VITE_DEMO_CLIENT_CODE = DEMO-MFG-001

[build]
  base    = "demos/new-demo/frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA routing — all non-asset paths → index.html so React Router handles them
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Proxy /api/* → Code Engine backend (avoids CORS during local Netlify Dev)
# In production Netlify builds, VITE_API_BASE_URL points directly to Code Engine,
# so React calls the Code Engine URL directly (no proxy needed at runtime).
# This rule is useful only during `netlify dev` local testing.
[[redirects]]
  from   = "/api/*"
  to     = ":VITE_API_BASE_URL/:splat"
  status = 200
  force  = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
